<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F8FC" />
  <title>LifeTrace Execute · High-Fidelity Browser Preview</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="features-v3.css" />
</head>
<body>
  <main class="preview-stage">
    <aside class="preview-copy" aria-label="预览说明">
      <div class="brand-lockup">
        <div class="brand-mark">L</div>
        <div>
          <strong>LifeTrace Execute</strong>
          <span>Android UI · Browser Prototype</span>
        </div>
      </div>
      <h1>先在浏览器里把 Android 体验打磨到位。</h1>
      <p>零依赖高保真原型，保持 360 × 800 dp 的移动端信息密度。所有一级入口都保留，可直接点击检查导航、任务状态、番茄专注、项目进度、重要日期、日历、收集与复盘流程。</p>
      <div class="preview-hints">
        <span>5 个底部一级入口</span>
        <span>任务页番茄时钟</span>
        <span>公历 / 农历重要日期</span>
        <span>头像进入“我的”</span>
        <span>今日复盘独立流程</span>
        <span>无需 npm / Android SDK</span>
      </div>
      <div class="preview-note">
        <span class="preview-note-dot"></span>
        当前版本为视觉与交互基线，确认后再同步到 Compose。
      </div>
    </aside>

    <section class="device-wrap" aria-label="LifeTrace Execute 手机预览">
      <div class="device-shadow"></div>
      <div class="device" id="device">
        <div class="status-bar" aria-hidden="true">
          <span class="status-time">16:59</span>
          <div class="status-icons">
            <span class="signal-bars"><i></i><i></i><i></i><i></i></span>
            <span class="wifi-mark"></span>
            <span class="battery"><i></i></span>
          </div>
        </div>
        <div id="app" class="app-content"></div>
        <nav id="bottom-nav" class="bottom-nav" aria-label="主导航"></nav>
        <div class="gesture-bar" aria-hidden="true"><span></span></div>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
        <div id="modal-root"></div>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
  <script src="features-v3.js"></script>
</body>
</html>
